# Letta 0.16.8 server + pgvector, two containers. Archival memory only: no LLM call is made at ingest or search, and the proxy that stands in as the
# agent's LLM is started with a $0 cap so any LLM call would fail loudly. Embeddings come from the local bge-small endpoint inside the letta container.
#   export DEEPSEEK_API_KEY=...   (only used to start the proxy; the $0 cap means it is never spent)
#   docker compose -f compose/letta/docker-compose.yml up -d --build
#   docker compose -f compose/letta/docker-compose.yml exec letta python drivers/letta_driver.py --units /work/units_n100.jsonl --out /results/letta --procs 8
services:
  pg:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta-local-only
      POSTGRES_DB: letta
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # the wheel's migrations need the vector type to exist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 5s
      retries: 20
  letta:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    environment:
      LETTA_PG_URI: postgresql://letta:letta-local-only@pg:5432/letta
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      LETTA_URLS: http://127.0.0.1:8283
      LEDGER_PATH: /results/ledger.jsonl   # /repo is mounted read-only
      LETTA_LLM_URL: http://127.0.0.1:18801/letta/v1
      EMBED_URLS: http://127.0.0.1:18811/v1
    volumes:
      - ../../:/repo:ro
      - ../../work:/work
      - ../../results:/results
      - fastembed-cache:/cache
    command: >
      sh -c "python /repo/infra/embed_server.py 18811 &
             python /repo/infra/dsproxy.py 18801 /results/letta-proxy.log 0 &
             cd /opt/letta-migrations && alembic upgrade head && cd /tmp && letta server --host 127.0.0.1 --port 8283"
volumes:
  fastembed-cache:
networks:
  default:
    ipam:
      config:
        - subnet: ${LANE_SUBNET:-10.77.0.0/24}   # an explicit subnet: a host whose Docker address pools are used up cannot create a default network
