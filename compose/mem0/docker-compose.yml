# mem0 OSS 2.2.1, one container (at most 2 containers per lane). mem0 runs in-process with an on-disk Qdrant per haystack, so there is no database service.
# Inside the container: the local embedder (:18811), the metering proxy to DeepSeek (:18800, per-haystack cost at /stats?tag=mem0__<unit>), then the driver.
#   export DEEPSEEK_API_KEY=...   (never commit it)
#   docker compose -f compose/mem0/docker-compose.yml up -d --build
#   docker compose -f compose/mem0/docker-compose.yml exec mem0 python drivers/mem0.py --units /work/units_n100.jsonl --out /results/mem0 --procs 8
#   docker compose -f compose/mem0/docker-compose.yml down
services:
  mem0:
    build: .
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      MEM0_LLM_MODEL: deepseek-flash
      EMBED_URLS: http://127.0.0.1:18811/v1
    volumes:
      - ../../:/repo:ro
      - ../../work:/work
      - ../../results:/results
      - fastembed-cache:/cache
    command: >
      sh -c "mkdir -p /work/tmp/mem0 &&
             python infra/embed_server.py 18811 &
             python infra/dsproxy.py 18800 /results/mem0-proxy.log &
             sleep infinity"
volumes:
  fastembed-cache:
